APP_VERSION=1.1.1
APP_RELEASE=beta-0

LIST_IPSET_TTL=86400

DNS_DEFAULT=127.0.0.1#9753
DNS_STATIC_1=9.9.9.9
DNS_STATIC_2=8.8.8.8

DNSMASQ_LISTEN_IP=
DNSMASQ_PORT=9753
DNSMASQ_SWAP_PORT=6953

SSR_DNS_PORT=1181

DNS_CRYPT_PORT=9153

# Split DNS. DNS_PROVIDER — куда идут домены вне списков: пусто = автоматически
# (штатный DNS Keenetic 127.0.0.1#53, следует за WAN), либо свои через запятую:
# 1.1.1.1,8.8.8.8 или 192.168.1.5#5353
DNS_PROVIDER=
# Что делать с доменами слота, если его dnscrypt (через VPN) не отвечает:
# provider — временно резолвить через провайдера (раскрывает домены провайдеру)
# closed   — не резолвить вовсе (никаких запросов вне VPN)
DNS_VPN_FAILURE=closed
# slot-2 failure: policy = DNS_VPN_FAILURE; slot1 = try healthy slot-1 first
DNS_SLOT2_FALLBACK=policy
# Empty stamp = static Quad9 DoH on port 443 via the corresponding VPN slot.
# No external country detection and no remote resolver-list bootstrap.
DNS_STAMP_1=
DNS_STAMP_2=

GW_DEFAULT=
MASK_DEFAULT=
ETH_DEFAULT=
EXTERNAL_IP=

INFACE_CLI=
INFACE_ENT=
INFACE_GUEST_ENT=

SETUP_FINISHED=

# LAN bridge used by DNS interception and VPN marking
LAN_INTERFACE=br0
