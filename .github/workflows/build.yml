name: Build release files (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: tools/quic-probe/go.sum
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_public.py
      - run: python tools/fetch_xray.py
      - run: python tools/build_quic_probe.py
      - run: python build.py
      - run: python tests/verify_dist.py
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pivas-custom31-review
          path: release-assets/
          if-no-files-found: error
